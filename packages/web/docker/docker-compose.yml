name: docai-web

services:
  web:
    build:
      context: ../../..
      dockerfile: packages/web/docker/Dockerfile
    env_file: ../.env
    environment:
      API_PROXY_TARGET: http://host.docker.internal:8080
    ports:
      - "5173:5173"
      - "6006:6006"
    volumes:
      - ../../..:/app
      - root_node_modules:/app/node_modules
      - node_modules:/app/packages/web/node_modules
      - firebase_config:/home/node/.config

  playwright:
    build:
      context: ../../..
      dockerfile: packages/web/docker/Dockerfile.playwright
    environment:
      CI: "true"
    volumes:
      - ../../..:/app
      - root_node_modules:/app/node_modules
      - node_modules:/app/packages/web/node_modules

volumes:
  root_node_modules:
  node_modules:
  # firebase login の認証情報（/home/node/.config/configstore）を保持する
  firebase_config:
