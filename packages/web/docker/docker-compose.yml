name: docai-web

services:
  web:
    build:
      context: ../../..
      dockerfile: packages/web/docker/Dockerfile
    environment:
      # dev サーバーの proxy 転送先。FUNCTIONS_API_KEY は Vite が
      # packages/web/.env.local から直接読むため、env_file は不要（ADR-0015）。
      API_PROXY_TARGET: http://host.docker.internal:8080
    ports:
      - "5173:5173"
      - "6006:6006"
    volumes:
      - ../../..:/app
      - root_node_modules:/app/node_modules
      - node_modules:/app/packages/web/node_modules

  playwright:
    build:
      context: ../../..
      dockerfile: packages/web/docker/Dockerfile.playwright
    environment:
      CI: "true"
    volumes:
      - ../../..:/app
      - root_node_modules:/app/node_modules
      - node_modules:/app/packages/web/node_modules

volumes:
  root_node_modules:
  node_modules:
