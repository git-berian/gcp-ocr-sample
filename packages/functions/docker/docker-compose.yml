name: docai-functions

services:
  functions:
    build:
      context: ../../..
      dockerfile: packages/functions/docker/Dockerfile
    env_file: ../.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/sa.json
    ports:
      - "8080:8080"
    volumes:
      - ../../..:/app
      - root_node_modules:/app/node_modules
      - node_modules:/app/packages/functions/node_modules

volumes:
  root_node_modules:
  node_modules:
