name: Issue
description: 不具合・改善・タスク用の共通テンプレート
title: ""
labels: []
assignees: []

body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何をするIssueか簡潔に書いてください
      placeholder: 例）OCR実行時にタイムアウトエラーが発生する
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: 変更内容
      description: 実施する内容を具体的に記載
      placeholder: |
        - 原因調査
        - 修正実装
        - テスト追加

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ対応が必要か
      placeholder: |
        - 現在〇〇の問題がある
        - ユーザー影響が出ている
