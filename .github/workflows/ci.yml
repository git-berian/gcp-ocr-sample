name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: ["functions", "web"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - run: npm ci
        working-directory: packages/${{ matrix.package }}

      - name: Lint
        run: npm run lint
        working-directory: packages/${{ matrix.package }}

      - name: Format check
        run: npm run format:check
        working-directory: packages/${{ matrix.package }}

      - name: Build
        run: npm run build
        working-directory: packages/${{ matrix.package }}

      - name: Test with coverage
        run: npm run test:coverage
        working-directory: packages/${{ matrix.package }}

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  visual-regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/web/package-lock.json

      - run: npm ci
        working-directory: packages/web

      - name: Build Storybook
        run: npm run build:storybook
        working-directory: packages/web

      - name: Run visual regression tests
        run: npm run test:visual
        working-directory: packages/web
        env:
          HOME: /root

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 30

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          ADDITIONS=$(gh pr view ${{ github.event.pull_request.number }} --json additions --jq '.additions')
          echo "PR additions: $ADDITIONS"
          if [ "$ADDITIONS" -gt 500 ]; then
            echo "::warning::PR が 500 行を超えています（${ADDITIONS} 行）。分割を検討してください。"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
